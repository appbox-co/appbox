packages:
  - "apps/*"
  - "packages/*"

trustLockfile: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "@types/react": "^19.0.10"
  "@types/react-dom": "^19.0.4"
  postcss: "8.5.10"
  posthog-js>dompurify: "3.4.2"
  "@microsoft/tsdoc-config>ajv": "6.14.0"
  mdx-bundler>uuid: "14.0.0"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - core-js
  - esbuild
  - sharp
  - unrs-resolver
